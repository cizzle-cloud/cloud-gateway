repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      # Run on the whole module (not just changed files) so cross-file
      # linters like `unused` and `goconst` behave correctly.
      - id: golangci-lint-full
      # Ensure the golangci-lint configuration stays valid.
      - id: golangci-lint-config-verify
  # Run the whole test suite (not just changed files) since cross-package
  # behavior can be affected by anything in the module.
  - repo: local
    hooks:
      - id: go-test
        name: go test
        entry: go test -p=1 ./...
        language: system
        pass_filenames: false
        types: [go]